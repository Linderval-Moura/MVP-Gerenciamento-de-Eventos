<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Eventos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; }
        header { background-color: #0056b3; color: white; padding: 1.5rem; text-align: center; }
        nav { background-color: #004494; padding: 1rem; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        main { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; }
    </style>
</head>
<body>
    <header><h1>Sistema de Gerenciamento de Eventos</h1></header>
    <nav>
        <a href="#">Início</a>
        <a href="#">Ver Eventos</a>
        <a href="#">Cadastrar Novo</a>
    </nav>
    <main>
        <h2>Meus Eventos</h2>
        <button class="btn">+ Novo Evento</button>
        <table>
            <tr><th>ID</th><th>Nome</th><th>Data</th><th>Local</th><th>Ações</th></tr>
            <tr><td>1</td><td>Tech Summit</td><td>15/10/2026</td><td>Centro de Convenções</td><td>Editar | Excluir</td></tr>
        </table>
    </main>
</body>
</html>
